name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Pyflakes
        run: |
          # `from fasthtml.common import *` makes pyflakes warn about every FT
          # component name ("may be undefined, or defined from star imports"),
          # and pyflakes exits non-zero whenever it warns at all — so tolerate
          # the exit code (`|| true`); `bash -e` would otherwise kill the step
          # before the filter runs. `uv run` also prints a VIRTUAL_ENV warning
          # on stdout in CI — the filter drops "warning:" lines.
          out=$(uv run python -m pyflakes main.py config.py || true)
          echo "$out"
          if echo "$out" | grep -vE "^warning:|star imports|unable to detect undefined names" | grep -q .; then exit 1; fi

      - name: Pytest
        run: uv run pytest -q
